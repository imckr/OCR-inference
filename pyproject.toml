[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-inference"
version = "1.0.0"
description = "Self-hosted OCR inference platform with API key management and dashboard"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Inferia AI"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "pillow>=10.2.0",
    "transformers>=4.57.0,<5",
    "huggingface-hub>=0.34.0",
    "python-multipart",
    "pydantic>=2.0.0",
    "python-dotenv",
    "aiofiles",
    "accelerate",
    "einops",
    "protobuf",
    "sentencepiece",
    "pymupdf",
    "sqlalchemy>=2.0.0",
    "pyjwt>=2.0.0",
    "email-validator",
    "bcrypt>=4.0.0",
    "psutil>=5.9.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "numpy<2",
    "paddlepaddle>=3.0.0",
    "paddleocr[doc-parser]>=3.4.0",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.6.0",
]
dev = [
    "black",
    "flake8",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
ocr = "dotsocr.cli:main"

[project.urls]
Repository = "https://github.com/inferiaAI/DotsOCR"

[tool.setuptools.packages.find]
include = ["dotsocr*"]

[tool.setuptools.package-data]
dotsocr = ["dashboard/static/**/*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true
